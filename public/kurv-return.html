<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Payment · NovaMDK</title>
    <!--
      Where Kurv's payment page lands when the patient finishes or cancels. It
      usually loads inside the checkout's iframe, sometimes in a small window of
      its own. Either way its only job is to tell the checkout what happened.

      It says what the patient did, never whether money moved: the checkout
      takes this as a prompt to ask the server, which asks Kurv. A hand-typed
      ?s=done proves nothing and unlocks nothing.

      Plain HTML rather than a React route so it paints instantly inside a small
      frame and loads none of the site around it.
    -->
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #faf8f3;
        color: #1a2420;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      h1 { font-size: 1.2rem; margin: 12px 0 6px; }
      p { margin: 0; color: #5f6b66; font-size: 0.95rem; line-height: 1.5; }
      .dot {
        width: 40px; height: 40px; margin: 0 auto; border-radius: 50%;
        border: 3px solid #e4ddcc; border-top-color: #a8842f;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="dot" aria-hidden="true"></div>
      <h1 id="title">Finishing up…</h1>
      <p id="note">Returning you to your intake.</p>
    </main>
    <script>
      (function () {
        var s = new URLSearchParams(location.search).get("s");
        var outcome = s === "cancel" ? "cancel" : "done";
        var msg = { source: "novamdk-kurv", outcome: outcome };

        // Inside the checkout's iframe: tell the page around it.
        if (window.parent && window.parent !== window) window.parent.postMessage(msg, location.origin);
        // A window the checkout opened: tell the tab that opened it.
        if (window.opener) {
          try { window.opener.postMessage(msg, location.origin); } catch (e) {}
        }
        // And any tab of ours, for a window that lost its link to the opener.
        try { new BroadcastChannel("novamdk-kurv").postMessage(msg); } catch (e) {}

        var standalone = !(window.parent && window.parent !== window);
        document.getElementById("title").textContent =
          outcome === "cancel" ? "Payment cancelled" : "Thank you";
        document.getElementById("note").textContent = standalone
          ? "You can close this window and return to your intake."
          : outcome === "cancel"
            ? "Returning you to checkout."
            : "Confirming your payment…";
        if (standalone) setTimeout(function () { window.close(); }, 1500);
      })();
    </script>
  </body>
</html>
