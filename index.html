    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="canonical" href="https://www.novamdk.com/" />

    <meta property="og:description" content="Personalized prescription treatments, reviewed by licensed physicians and delivered to your door." />
    <meta property="og:type" content="website" />

      "@context": "https://schema.org",

      "url": "https://www.novamdk.com/"

      "@context": "https://schema.org",

      "sameAs": []
    }

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- The GoHighLevel chat widget used to be pasted here, and was commented
         out on request on 2026-09-01. It now lives in src/lib/supportChat.js
         and loads ONLY inside the patient portal, which is the client's
         decision of 2026-10-07.

         Do not paste it back here. A script tag in this document runs on every
         route, /intake among them, and a support chat floating over a medical
         questionnaire invites a patient to type a symptom into a CRM. That is
         the one thing the widget's own copy is written to prevent. -->
  </body>
